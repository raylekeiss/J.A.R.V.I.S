name: 評価付き追加学習

on:
  push:
    branches: [main]
    paths:
      - 'add.jsonl'
      - 'inbox/**'
      - 'data/corrections/**'
  workflow_dispatch:
    inputs:
      mode:
        description: '通常はincremental、全件再学習だけretrain'
        type: choice
        options: [incremental, retrain]
        default: incremental
      steps:
        description: '学習ステップ数（1〜16000）'
        default: '1500'
        type: string
  schedule:
    # 月曜朝（日本時間）。ChatGPTによる教材生成とは別の、待機データの処理です。
    - cron: '0 1 * * 1'

permissions:
  contents: read

concurrency:
  group: training-and-pages
  cancel-in-progress: false

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      accepted: ${{ steps.result.outputs.accepted }}
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      # Queue runs always start from the latest main, not an obsolete inbox snapshot.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: テスト
        run: python -m unittest discover -s tests -v
      - name: 候補モデルの学習と比較
        env:
          TRAIN_MODE: ${{ inputs.mode || 'incremental' }}
          TRAIN_STEPS: ${{ inputs.steps || '1500' }}
        run: python -m scripts.train_candidate --mode "$TRAIN_MODE" --steps "$TRAIN_STEPS"
      - name: 判定結果
        id: result
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('reports/latest.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('accepted=' + str(report['accepted']).lower() + '\n')
          summary = Path('reports/latest.md')
          if summary.exists():
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write(summary.read_text())
          PY
      - name: 評価結果と前モデルを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-report-${{ github.run_id }}
          path: reports/
          retention-days: 14
      - name: 合格したデータとモデルをまとめて保存
        id: publish
        if: steps.result.outputs.accepted == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898281+github-actions[bot]@users.noreply.github.com'
          git add dialogues.jsonl model.npz docs/model.json docs/model.bin inbox added
          git add reports/latest.json reports/latest.md reports/input_topics.json
          if [ -e add.jsonl ] || git ls-files --error-unmatch add.jsonl >/dev/null 2>&1; then
            git add -A -- add.jsonl
          fi
          git diff --cached --quiet && exit 0
          git commit -m '学習・評価合格: データとモデルを更新'
          # Concurrent remote edits cause a failure, not an overwrite or deployment.
          git push origin HEAD:main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Pages用ファイルを保存
        if: steps.result.outputs.accepted == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: train
    if: needs.train.outputs.accepted == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.pages_mode.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.train.outputs.commit }}
      - name: 現在のPages方式を確認
        id: pages_mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.publish_pages --inspect-only
      - name: ブランチ方式のPagesビルドを明示的に起動して確認
        if: steps.pages_mode.outputs.build_type == 'legacy'
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTED_COMMIT: ${{ needs.train.outputs.commit }}
        run: python -m scripts.publish_pages --commit "$ACCEPTED_COMMIT"
      - name: Actions方式で合格モデルを公開
        if: steps.pages_mode.outputs.build_type == 'workflow'
        id: deployment
        uses: actions/deploy-pages@v4
