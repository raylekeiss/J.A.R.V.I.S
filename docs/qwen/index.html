<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f5d50"><title>J.A.R.V.I.S</title>
<link rel="stylesheet" href="style.css?v=compact-cache-2">
</head>
<body><main class="app">
<header><h1>J.A.R.V.I.S</h1><a href="../">軽量版</a></header>
<section class="model-controls" aria-label="モデル">
<button id="load" type="button">はじめる</button>
<p id="status" role="status" aria-live="polite"></p>
<progress id="progress" max="100" hidden></progress>
</section>
<div id="log" aria-label="会話" aria-live="off"></div>
<div class="conversation-tools"><button id="clear" type="button">クリア</button><button id="stop" type="button" hidden>停止</button></div>
<form id="form"><label for="msg" class="sr-only">メッセージ</label><textarea id="msg" rows="2" maxlength="400" placeholder="メッセージを入力" disabled></textarea><button id="send" type="submit" disabled>送信</button></form>
</main><script type="module" src="app.js?v=compact-cache-2"></script></body></html>
